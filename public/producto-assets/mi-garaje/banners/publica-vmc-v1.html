     y lenguaje de los banners del index (vmc-index-lab): Plus Jakarta Sans, morado con brasa, lila claro, CTA primary de Concorde.
     Seis composiciones distintas (cambia qué manda en la jerarquía, no solo el fondo):
       01-foto     la foto a sangre manda; titular grande encima, sombra para leer.
       02-persona  una persona con su celular; dato en píldora («Un solo pago» del index).

       04-pasos    el proceso: 3 pasos numerados y la foto en un panel redondeado (fondo blanco).
       05-tarjeta  producto: una tarjeta Negociable de ejemplo con una propuesta entrante.
       06-moto     bloque de color: disco naranja enorme y la moto rompiéndolo.
